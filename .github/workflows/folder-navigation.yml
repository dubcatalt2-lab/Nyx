name: Built-in document navigation
on:
  push:
    branches: [main, agent/pirate-cove, fix/cached-document-redirects-20261010]
  pull_request:
permissions:
  contents: read
jobs:
  cached-redirects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node rituals/test-cached-folder-navigation.mjs
      - run: node rituals/test-local-folder-navigation.mjs
      - run: node rituals/test-worker-port.mjs
