name: Document connection and release audit
on:
  push:
    branches: [main, agent/pirate-cove, agent/nyx-page-wording-20261008]
  pull_request:
permissions:
  contents: read
jobs:
  document-connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: connection/package-lock.json
      - run: npm ci
      - run: node rituals/test-dependency-purge.mjs
      - run: npm ci --prefix connection
      - run: npx playwright install --with-deps chromium
      - run: npm run test:lesson-assets
      - run: node --test rituals/test-release-repairs.mjs
      - run: node rituals/test-cached-folder-navigation.mjs
      - run: npm --prefix connection run build
      - run: npm run test:network
      - run: node connection/isolated-smoke.mjs
        env:
          NYX_TEST_SHELL_URL: auto
      - run: node rituals/test-document-window.mjs
  complete-release-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node rituals/test-dependency-purge.mjs
      - run: npm run build:vps
      - run: npx playwright install --with-deps chromium
      - run: node rituals/test-lesson-runtime-browser.mjs
      - run: npm run check:deploy
      - run: npm run check:release-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-audit
          path: .codex-artifacts/release-audit.json
