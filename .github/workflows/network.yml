name: Connection adapter
on:
  push:
    branches: [main, agent/pirate-cove]
  pull_request:
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:network
      - run: node rituals/audit-release.mjs relics/network
      - run: node rituals/audit-release.mjs scripture/network
