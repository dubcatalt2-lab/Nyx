name: Retired engine audit
on:
  push:
    branches: [main, agent/pirate-cove]
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node rituals/check-retired-engine.mjs . --tracked
