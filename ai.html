<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Nyx AI</title>
  <link rel="icon" type="image/png" href="/assets/icons/nyx-logo.png" data-nyx-logo>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/ai-workspace.css?v=20260803-v1">
  <script src="/js/nyx-logo.js?v=20260717-theme-crescent-v1" defer></script>
  <script src="/js/ai-workspace.js?v=20260803-v1" defer></script>
</head>
<body>
  <main class="ai-app" data-ai-app>
    <header class="ai-header">
      <div class="ai-header-inner">
        <div class="ai-brand">
          <div class="ai-brand-mark" data-nyx-logo aria-hidden="true"></div>
          <div class="ai-brand-copy">
            <span>NYX INTELLIGENCE</span>
            <h1>Nyx AI</h1>
          </div>
          <span class="ai-header-divider" aria-hidden="true"></span>
          <p class="ai-thread-title" id="threadTitle">New conversation</p>
        </div>

        <div class="ai-header-actions">
          <label class="ai-model-control" for="model">
            <span class="ai-model-status" aria-hidden="true"></span>
            <span class="sr-only">AI model</span>
            <select id="model" aria-label="AI model">
              <option value="chatgpt-5.4-mini">GPT-5.4 Mini</option>
            </select>
            <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m6 8 4 4 4-4"/></svg>
          </label>
          <button class="ai-clear" id="clear" type="button" title="Clear conversation" aria-label="Clear conversation">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M7 6l1 14h8l1-14M10 10v6M14 10v6"/></svg>
            <span>Clear</span>
          </button>
        </div>
      </div>
    </header>

    <section class="ai-feed" id="feed" role="log" aria-live="polite" aria-relevant="additions text" aria-busy="false">
      <div class="ai-conversation" id="conversation"></div>
    </section>

    <footer class="ai-composer-shell">
      <div class="ai-composer-wrap">
        <form class="ai-composer" id="form">
          <label class="sr-only" for="input">Message Nyx AI</label>
          <textarea id="input" rows="1" maxlength="4000" placeholder="Ask Nyx AI anything…" aria-label="Message Nyx AI"></textarea>
          <div class="ai-composer-footer">
            <span class="ai-composer-hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line</span>
            <span class="ai-character-count" id="characterCount" aria-live="off">0 / 4000</span>
            <button class="ai-send" id="send" type="submit" title="Send message" aria-label="Send message">
              <svg class="ai-send-arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="m12 19V5m0 0-6 6m6-6 6 6"/></svg>
              <span class="ai-send-spinner" aria-hidden="true"></span>
            </button>
          </div>
        </form>
        <p class="ai-disclaimer">Nyx AI can make mistakes. Verify important information.</p>
      </div>
    </footer>
  </main>
</body>
</html>
