<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Learn to code with short Nyx lessons, examples, and practice.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Nyx Code Tutorials</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/code-tutorials.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260902-code-tutorials-v1">
  <script src="./app.js?v=20260902-code-tutorials-v1" defer></script>
</head>
<body>
  <main class="tutorials-shell" data-tutorials>
    <header class="topbar"><a href="/" target="_top"><img src="/assets/icons/code-tutorials.svg?v=1" alt=""> <strong>Nyx Code Tutorials</strong></a><span data-save-state>Progress stays on this device</span></header>
    <aside class="course-rail"><p>Learn</p><h1>Pick a path</h1><div data-course-list class="course-list"></div><div class="account-note" data-account-note>Sign in to keep your progress across devices.</div></aside>
    <section class="lesson"><header><p data-course-label>JavaScript</p><h2 data-lesson-title>Start with values</h2><span data-progress-label>0 of 3 finished</span></header><article data-lesson-copy></article><section class="example"><div><span>Example</span><button type="button" data-copy-example>Copy</button></div><pre data-example-code></pre></section><section class="practice"><label for="practiceCode">Try it yourself</label><textarea id="practiceCode" data-practice-code spellcheck="false"></textarea><div><button type="button" class="run" data-run-practice>Run example</button><button type="button" data-finish-lesson>Mark complete</button></div><pre data-practice-output aria-live="polite">Choose Run example to check your work.</pre></section><nav><button type="button" data-previous>Previous</button><button type="button" data-next>Next lesson</button></nav></section>
    <iframe data-practice-runner sandbox="allow-scripts" hidden title="JavaScript practice runner"></iframe>
  </main>
</body>
</html>
