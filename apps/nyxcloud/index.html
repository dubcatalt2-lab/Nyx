<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>VMs</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="workspace-bar">
    <div class="workspace-brand">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="13" rx="3"/><path d="M8 21h8m-4-5v5M8 8h8"/></svg></span>
      <div><strong>NyxCloud</strong><span class="brand-caption">Your desktop</span></div>
    </div>
    <div class="connection-state"><span class="state-dot" aria-hidden="true"></span><span id="status" role="status">Preparing workspace</span></div>
    <div class="workspace-actions">
      <button id="fullscreen" class="expand-button" disabled title="Expand desktop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>Expand</span></button>
      <details class="session-menu">
        <summary aria-label="Desktop options" title="Desktop options"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></summary>
        <div class="menu-panel">
          <span class="menu-label">DISPLAY</span>
          <button id="display-scale" aria-pressed="true" title="Stretch the desktop to fill the available space">Fill screen: On</button>
          <span class="menu-label">SESSION</span>
          <button id="connect" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5m-4-4a8 8 0 0 1 13-3l2 3M4 16l2 3a8 8 0 0 0 13-3"/></svg>Reconnect</button>
          <button id="disconnect" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9m-5-7a9 9 0 1 0 10 0"/></svg>Disconnect</button>
          <button id="end-session" disabled>End session and free desktop</button>
        </div>
      </details>
    </div>
  </header>
  <main id="screen" aria-label="Virtual desktop"></main>
  <footer class="workspace-footer"><span><span class="footer-dot"></span>Private workspace</span><span>NyxCloud</span></footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
