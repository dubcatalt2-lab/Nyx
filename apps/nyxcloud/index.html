<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>NyxCloud</title>
  <link rel="icon" href="/assets/icons/shortcut-nyxcloud.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/apps/media-browser.css?v=20260813-media-apps-v1">
</head>
<body data-provider="soundcloud">
  <main class="utility-shell media-shell">
    <header class="utility-header">
      <a class="brand-lockup" href="/" aria-label="Nyx home">
        <span class="brand-mark media-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7.3 17h9.3a3.4 3.4 0 0 0 .5-6.76A5.2 5.2 0 0 0 7.18 11.7 2.65 2.65 0 0 0 7.3 17Z" fill="currentColor"/></svg></span>
        <span class="brand-copy"><strong>NyxCloud</strong><span>Official player</span></span>
      </a>
      <nav class="utility-nav" aria-label="NyxCloud navigation">
        <button class="utility-nav-item" type="button" data-back-to-nyx><span>Back to Nyx</span></button>
      </nav>
    </header>

    <section class="media-intro">
      <h1>Find your next sound.</h1>
      <p>Search playable SoundCloud tracks through the official API and listen using SoundCloud's supported embedded player.</p>
    </section>

    <form class="media-search" data-media-search>
      <input data-media-query type="search" maxlength="100" autocomplete="off" spellcheck="false" placeholder="Search tracks, artists, or genres" aria-label="Search SoundCloud">
      <button data-media-submit type="submit">Search SoundCloud</button>
    </form>
    <p class="media-notice" data-media-notice hidden></p>

    <section aria-live="polite">
      <div class="media-status-row">
        <span class="media-status" data-media-status><i></i><span data-media-status-text>Checking API…</span></span>
        <span class="media-count" data-media-count></span>
      </div>
      <div class="media-results" data-media-results></div>
    </section>
  </main>

  <aside class="media-player" data-media-player hidden>
    <header class="media-player-header"><span><strong data-media-player-title></strong><small data-media-player-creator></small></span><button type="button" data-media-player-close aria-label="Close player">×</button></header>
    <div class="media-player-frame" data-media-player-frame></div>
  </aside>
  <script src="/apps/media-browser.js?v=20260813-media-apps-v1"></script>
</body>
</html>
