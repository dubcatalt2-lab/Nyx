<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>NyxTube</title>
  <link rel="icon" href="/assets/icons/shortcut-nyxtube.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/apps/media-browser.css?v=20260813-media-apps-v3">
  <link rel="stylesheet" href="/apps/nyxtube/app.css?v=20260813-nyxtube-v3">
</head>
<body data-provider="youtube">
  <svg class="tube-symbols" aria-hidden="true">
    <symbol id="tube-home" viewBox="0 0 24 24"><path d="m3 11 9-7 9 7v9h-6v-6H9v6H3v-9Z"/></symbol>
    <symbol id="tube-search" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.2"/><path d="m15.4 15.4 4.2 4.2"/></symbol>
    <symbol id="tube-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
    <symbol id="tube-back" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></symbol>
    <symbol id="tube-play" viewBox="0 0 24 24"><path d="m9 6.5 9 5.5-9 5.5v-11Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="tube-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
  <div class="tube-app">
    <aside class="tube-rail" aria-label="NyxTube navigation">
      <a class="tube-mark" href="/" aria-label="Nyx home"><img src="/assets/icons/shortcut-nyxtube.svg" alt=""></a>
      <nav>
        <button class="active" type="button" data-media-home aria-label="Home" title="Home"><svg><use href="#tube-home"></use></svg><span>Home</span></button>
        <button type="button" data-media-focus-search aria-label="Search" title="Search"><svg><use href="#tube-search"></use></svg><span>Search</span></button>
        <button type="button" data-media-home aria-label="Discover" title="Discover"><svg><use href="#tube-grid"></use></svg><span>Discover</span></button>
      </nav>
      <button class="tube-rail-back" type="button" data-back-to-nyx aria-label="Back to Nyx" title="Back to Nyx"><svg><use href="#tube-back"></use></svg><span>Back</span></button>
    </aside>

    <main class="tube-main">
      <section class="tube-hero">
        <span class="tube-eyebrow">NYX VIDEO</span>
        <h1>NyxTube</h1>
        <p>Find videos without leaving your workspace.</p>
        <span class="media-status" data-media-status><i></i><span data-media-status-text>Checking video catalog</span></span>
        <form class="media-search tube-search" data-media-search>
          <svg aria-hidden="true"><use href="#tube-search"></use></svg>
          <input data-media-query type="search" maxlength="100" autocomplete="off" spellcheck="false" placeholder="Search videos or paste a topic..." aria-label="Search YouTube">
          <button data-media-submit type="submit"><span>Go</span><svg aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
        </form>
        <nav class="tube-chips" aria-label="Suggested searches">
          <button type="button" data-media-suggestion="music">Music</button>
          <button type="button" data-media-suggestion="gaming">Gaming</button>
          <button type="button" data-media-suggestion="coding tutorials">Coding</button>
          <button type="button" data-media-suggestion="science documentaries">Science</button>
          <button type="button" data-media-suggestion="study with me">Study</button>
        </nav>
      </section>

      <p class="media-notice" data-media-notice hidden></p>
      <section class="media-setup tube-setup" data-media-setup hidden>
        <div class="media-setup-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H5v12h14V10h-2V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 0 1 6 0v3H9Z"/></svg></div>
        <div><span>SERVER CONNECTION</span><h2>Connect the video catalog</h2><p>Add <code>NYX_YOUTUBE_API_KEY</code> to the OVH environment and restart Nyx.</p></div>
      </section>

      <section class="tube-results-section" aria-live="polite">
        <header><span><small>EXPLORE</small><h2 data-media-section-title>Discover videos</h2></span><span class="media-count" data-media-count></span></header>
        <div class="media-results" data-media-results></div>
      </section>
    </main>

    <nav class="tube-mobile-dock" aria-label="NyxTube mobile navigation">
      <button class="active" type="button" data-media-home><svg><use href="#tube-home"></use></svg><span>Home</span></button>
      <button type="button" data-media-focus-search><svg><use href="#tube-search"></use></svg><span>Search</span></button>
      <button type="button" data-media-home><svg><use href="#tube-grid"></use></svg><span>Discover</span></button>
      <button type="button" data-back-to-nyx><svg><use href="#tube-back"></use></svg><span>Nyx</span></button>
    </nav>
  </div>

  <aside class="media-player tube-player" data-media-player hidden>
    <header class="media-player-header"><span><strong data-media-player-title></strong><small data-media-player-creator></small></span><button class="tube-player-compat" type="button" data-media-player-compat>Try standard player</button><button type="button" data-media-player-close aria-label="Close player"><svg><use href="#tube-close"></use></svg></button></header>
    <div class="media-player-frame" data-media-player-frame></div>
  </aside>
  <script src="/apps/media-browser.js?v=20260813-media-apps-v3"></script>
</body>
</html>
