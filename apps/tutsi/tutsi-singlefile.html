<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="tutsi-release" content="2026.09.18.1">
  <title>Tutsi</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1e1e2e;
      color: #f4f6fb;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #1e1e2e;
    }

    button,
    a { font: inherit; }

    .tutsi-launcher {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(147, 130, 245, 0.11), transparent 34rem),
        #1e1e2e;
    }

    .tutsi-launcher::before {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(196, 202, 220, 0.12) 1px, transparent 1.2px);
      background-size: 28px 28px;
      opacity: 0.22;
      content: "";
      pointer-events: none;
    }

    .tutsi-boot {
      position: relative;
      z-index: 1;
      display: grid;
      width: min(30rem, calc(100vw - 3rem));
      justify-items: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .tutsi-boot[hidden] {
      display: grid;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .tutsi-mark {
      width: 3.25rem;
      height: 3.25rem;
      filter: drop-shadow(0 0 1.25rem rgba(147, 130, 245, 0.3));
      animation: tutsi-float 2.8s ease-in-out infinite;
    }

    .tutsi-title {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .tutsi-status {
      min-height: 1.25rem;
      margin: 0;
      color: #929aaa;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    .tutsi-actions {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.625rem;
      margin-top: 0.35rem;
    }

    .tutsi-boot.is-delayed .tutsi-actions,
    .tutsi-boot.is-offline .tutsi-actions { display: flex; }

    .tutsi-action {
      min-height: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 0.75rem;
      padding: 0.6rem 0.9rem;
      background: rgba(15, 20, 32, 0.88);
      color: #f4f6fb;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .tutsi-action:hover {
      border-color: rgba(147, 130, 245, 0.42);
      background: rgba(24, 29, 45, 0.96);

    }

    .tutsi-action:active {  }

    .tutsi-action:focus-visible {
      outline: 3px solid rgba(147, 130, 245, 0.44);
      outline-offset: 2px;
    }

    #tutsiApp {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #1e1e2e;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    #tutsiApp.is-ready { opacity: 1; }

    @keyframes tutsi-float {
      50% { transform: translateY(-0.3rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

      <h1 class="tutsi-title">Opening Tutsi</h1>
      <p class="tutsi-status" id="tutsiStatus">Loading the latest Tutsi release&hellip;</p>
      <div class="tutsi-actions">
        <button class="tutsi-action" id="tutsiRetry" type="button">Try again</button>
        <a class="tutsi-action" href="https://tutsi.nyxlearning.org/?source=single-file" target="_blank" rel="noopener noreferrer">Open directly</a>
      </div>
    </section>

    <iframe
      id="tutsiApp"
      title="Tutsi"
      allow="autoplay; camera; clipboard-read; clipboard-write; display-capture; fullscreen; gamepad; geolocation; microphone; picture-in-picture; pointer-lock"
      allowfullscreen
      referrerpolicy="no-referrer"
    ></iframe>
  </main>

  <script>
    (() => {
      "use strict";

      const TUTSI_URL = "https://tutsi.nyxlearning.org/";
      const TUTSI_RELEASE = "2026.09.18.1";
      const frame = document.getElementById("tutsiApp");
      const boot = document.getElementById("tutsiBoot");
      const status = document.getElementById("tutsiStatus");
      const retry = document.getElementById("tutsiRetry");
      let delayedTimer = 0;

      const latestTutsiUrl = () => {
        const url = new URL(TUTSI_URL);
        url.searchParams.set("source", "single-file");
        url.searchParams.set("release", TUTSI_RELEASE);
        url.searchParams.set("fresh", Date.now().toString(36));
        return url.href;
      };

      const showWaitingState = () => {
        boot.hidden = false;
        boot.classList.remove("is-delayed", "is-offline");
        status.textContent = navigator.onLine
          ? "Loading the latest Tutsi release…"
          : "You appear to be offline. Tutsi needs an internet connection.";
        if (!navigator.onLine) boot.classList.add("is-offline");
      };

      const loadTutsi = () => {
        clearTimeout(delayedTimer);
        frame.classList.remove("is-ready");
        showWaitingState();
        if (!navigator.onLine) {
          frame.removeAttribute("src");
          return;
        }
        frame.src = latestTutsiUrl();
        delayedTimer = window.setTimeout(() => {
          if (frame.classList.contains("is-ready")) return;
          boot.classList.add("is-delayed");
          status.textContent = "Tutsi is taking longer than expected to respond.";
        }, 12000);
      };

      frame.addEventListener("load", () => {
        clearTimeout(delayedTimer);
        frame.classList.add("is-ready");
        boot.hidden = true;
      });

      retry.addEventListener("click", loadTutsi);
      window.addEventListener("online", loadTutsi);
      window.addEventListener("offline", showWaitingState);

      loadTutsi();
    })();
  </script>
