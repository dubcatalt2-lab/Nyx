<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>GAMES | Nyx</title>
  <link rel="stylesheet" href="/assets/games/games.css?v=20260824-games-cloud-v2">
  <script type="module" src="/assets/games/games.js?v=20260826-lumin-v2"></script>
</head>
<body>
  <main class="library">
    <header class="cove-header">
      <div class="cove-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M12 2.75a9.25 9.25 0 1 0 9.25 9.25A9.26 9.26 0 0 0 12 2.75Zm0 3.2 1.58 4.47L18.05 12l-4.47 1.58L12 18.05l-1.58-4.47L5.95 12l4.47-1.58Z"/>
        </svg>
      </div>
      <p class="eyebrow">Nyx arcade</p>
      <h1>GAMES</h1>
      <p class="subtitle">Pick a game and play instantly.</p>
    </header>

    <nav class="game-view-switch" aria-label="Game type">
      <button class="game-view-button active" type="button" data-game-view="all" aria-pressed="true">All Games</button>
      <button class="game-view-button" type="button" data-game-view="cloud" aria-pressed="false">Cloud Gaming</button>
    </nav>

    <section id="localGamesView" class="games-view">
    <section class="catalog-tools" aria-label="Browse games">
      <label class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m20.2 20.2-4.35-4.35m2.15-5.1a7.25 7.25 0 1 1-14.5 0 7.25 7.25 0 0 1 14.5 0Z"/>
        </svg>
        <span class="sr-only">Search games</span>
        <input id="gameSearch" type="search" autocomplete="off" placeholder="Search games...">
      </label>

      <label class="select-field library-field">
        <span class="sr-only">Game collection</span>
        <select id="gameLibrary">
          <option value="games">All games</option>
          <option value="misc">More games</option>
        </select>
      </label>

      <label class="select-field sort-field">
        <span class="sr-only">Sort games</span>
        <select id="gameSort">
          <option value="az">A&ndash;Z</option>
          <option value="za">Z&ndash;A</option>
        </select>
      </label>
    </section>

    <div class="library-meta">
      <p id="gameCount" role="status" aria-live="polite">Loading games&hellip;</p>
      <div id="catalogProgress" class="catalog-progress" aria-hidden="true"><span></span></div>
    </div>

    <section id="gameGrid" class="game-grid" aria-label="Game library"></section>

    <nav id="gamePagination" class="pagination" aria-label="Game library pages" hidden>
      <button id="previousPage" class="page-button" type="button">
        <span aria-hidden="true">&larr;</span> Previous
      </button>
      <span id="pageInfo" class="page-info" aria-live="polite">Page 1 of 1</span>
      <button id="nextPage" class="page-button" type="button">
        Next <span aria-hidden="true">&rarr;</span>
      </button>
    </nav>

    <section id="emptyState" class="empty-state" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m20.2 20.2-4.35-4.35m2.15-5.1a7.25 7.25 0 1 1-14.5 0 7.25 7.25 0 0 1 14.5 0Z"/>
      </svg>
      <h2>No games found</h2>
      <p>Try a shorter or different search.</p>
    </section>
    </section>

    <section id="cloudGamesView" class="games-view cloud-games-view" hidden>
      <iframe id="cloudGamingFrame" title="Cloud Gaming" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>
    </section>
  </main>

  <section id="gamePlayer" class="player" role="dialog" aria-modal="true" aria-labelledby="playerTitle" hidden>
    <header class="player-toolbar">
      <button id="closePlayer" class="toolbar-button back-button" type="button">
        <span aria-hidden="true">&larr;</span>
        <span>GAMES</span>
      </button>
      <h2 id="playerTitle">Game</h2>
      <div class="player-actions">
        <label class="provider-field" title="Change game provider">
          <span class="sr-only">Game provider</span>
          <select id="gameProvider" aria-label="Game provider"></select>
        </label>
        <button id="performanceGame" class="toolbar-button performance-button" type="button" title="Game performance mode: Auto" aria-label="Game performance mode: Auto" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 5 14h6l-1 8 8-12h-6z"/></svg>
          <span id="performanceGameLabel">Auto</span>
        </button>
        <button id="reloadGame" class="toolbar-button icon-button" type="button" title="Reload game" aria-label="Reload game">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6"/></svg>
        </button>
        <button id="fullscreenGame" class="toolbar-button icon-button" type="button" title="Fullscreen" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/></svg>
        </button>
      </div>
    </header>
    <div class="player-stage">
      <div id="playerLoading" class="player-loading" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <span id="playerLoadingText">Loading game&hellip;</span>
        <button id="retryGame" class="toolbar-button" type="button" hidden>Retry all sources</button>
      </div>
      <iframe id="gameFrame" title="Game" allow="autoplay; fullscreen; pointer-lock; gamepad; keyboard-map; clipboard-read; clipboard-write" allowfullscreen></iframe>
    </div>
  </section>
</body>
</html>
