<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GN Math Game</title>
  <style>
    *{box-sizing:border-box;font-weight:400!important;font-style:normal!important}
    html,body{height:100%;margin:0;background:#0b0f17;color:#f8fafc;font-family:Outfit,Arial,sans-serif}
    .loading{
      position:fixed;
      inset:0;
      z-index:2;
      display:grid;
      place-items:center;
      padding:24px;
      background:#0b0f17;
      text-align:center;
    }
    .loading.hidden{display:none}
    .box{
      max-width:540px;
      width:min(540px,calc(100vw - 48px));
      border:1px solid #a78bfa;
      border-radius:16px;
      padding:24px;
      background:#111827;
    }
    .progress-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:10px;
      color:#f8fafc;
      font-size:15px;
    }
    .progress-track{
      height:6px;
      overflow:hidden;
      border-radius:999px;
      background:rgba(248,250,252,.14);
    }
    .progress-fill{
      width:0;
      height:100%;
      border-radius:999px;
      background:#a78bfa;
      transition:width .2s ease;
    }
    .box button{
      margin-top:14px;
      border:1px solid #a78bfa;
      border-radius:10px;
      background:#0f172a;
      color:#f8fafc;
      padding:9px 14px;
      font:inherit;
      cursor:pointer;
    }
    .game-frame{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:#0b0f17;
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="box" id="status">
      <div class="progress-row">
        <span id="progressLabel">Loading</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>
  <iframe id="gameFrame" class="game-frame" title="GN Math game" sandbox="allow-scripts allow-forms allow-modals allow-downloads allow-pointer-lock allow-presentation" allow="fullscreen; gamepad; autoplay; keyboard-map; clipboard-read; clipboard-write; camera; microphone; display-capture; accelerometer; gyroscope; magnetometer; xr-spatial-tracking" allowfullscreen tabindex="0"></iframe>
  <script src="/assets/games/game-health.js" data-provider="gn"></script>
  <script type="module">
    import {prepareGameDocument} from '/assets/games/game-document.js';
    const loading=document.querySelector('.loading');
    const status=document.getElementById('status');
    const progressLabel=document.getElementById('progressLabel');
    const progressPercent=document.getElementById('progressPercent');
    const progressFill=document.getElementById('progressFill');
    const frame=document.getElementById('gameFrame');
    function focusGameFrame(){
      setTimeout(()=>{try{frame.focus({preventScroll:true})}catch{try{frame.focus()}catch{}}},0);
    }
    frame.addEventListener('load',()=>{
      setTimeout(focusGameFrame,80);
    });
    frame.addEventListener('pointerdown',focusGameFrame,{capture:true});
    document.addEventListener('pointerdown',focusGameFrame,true);
    document.addEventListener('wheel',event=>{
      if(event.ctrlKey) event.preventDefault();
    },{capture:true,passive:false});
    document.addEventListener('keydown',event=>{
      const key=String(event.key || '').toLowerCase();
      if(event.altKey && !event.ctrlKey && !event.metaKey && event.location!==2 && key==='alt'){
        event.preventDefault();
        event.stopPropagation();
        try{parent.postMessage({type:'nyx:alt-prime'},'*')}catch{}
        try{top.postMessage({type:'nyx:alt-prime'},'*')}catch{}
        return;
      }
      if(event.altKey && !event.ctrlKey && !event.metaKey && event.location!==2 && (/^[1-9]$/.test(key) || ['l','d','t','w','r','arrowleft','arrowright','tab'].includes(key))){
        event.preventDefault();
        event.stopPropagation();
        try{parent.postMessage({type:'nyx:alt-shortcut',key,code:event.code||'',location:event.location||0,shiftKey:!!event.shiftKey},'*')}catch{}
        try{top.postMessage({type:'nyx:alt-shortcut',key,code:event.code||'',location:event.location||0,shiftKey:!!event.shiftKey},'*')}catch{}
        return;
      }
      if((event.ctrlKey || event.metaKey) && ['+','=','-','_','0'].includes(key)){
        event.preventDefault();
        event.stopPropagation();
      }
    },true);
    const params=new URLSearchParams(location.search);
    const game=String(params.get('game') || '').replace(/^\/+/,'');
    let progressTimer=0;
    let gameLaunched=false;
    let gameLoadStarted=0;
    let gameReadySignal=false;

    function setGameProgress(value,label='Loading'){
      const percent=Math.max(0,Math.min(100,Math.round(value)));
      progressLabel.textContent=percent>=100 ? 'Launched' : label;
      progressPercent.textContent=`${percent}%`;
      progressFill.style.width=`${percent}%`;
      loading.classList.remove('hidden');
    }

    function startGameProgress(){
      clearInterval(progressTimer);
      gameLaunched=false;
      gameLoadStarted=performance.now();
      let progress=8;
      setGameProgress(progress);
      progressTimer=setInterval(()=>{
        progress=Math.min(94,progress + Math.max(1,(96-progress)*.1));
        setGameProgress(progress);
      },210);
    }

    function finishGameProgress(){
      if(gameLaunched) return;
      if(!gameReadySignal && !gameSurfaceReady()){
        if(performance.now()-gameLoadStarted>11000){
          fail('This game loaded a blank screen. One of its required files is missing or blocked.');
          return;
        }
        setTimeout(finishGameProgress,700);
        return;
      }
      gameLaunched=true;
      clearInterval(progressTimer);
      setGameProgress(100,'Launched');
      parent.postMessage({type:'nyx:game-launched'},'*');
      setTimeout(()=>loading.classList.add('hidden'),650);
    }

    function fail(message){window.nyxReportGameFailure?.(/blank|timed out/i.test(String(message))?'startup-timeout':'load-error');
      clearInterval(progressTimer);
      status.innerHTML='';
      status.append(document.createTextNode(String(message || 'This game failed to load.')));
      const retry=document.createElement('button');
      retry.type='button';
      retry.textContent='Retry';
      retry.addEventListener('click',()=>location.reload());
      const library=document.createElement('button');
      library.type='button';
      library.textContent='Open game library';
      library.addEventListener('click',()=>location.href='/assets/games/index.html');
      status.append(document.createElement('br'),retry,document.createTextNode(' '),library);
      loading.classList.remove('hidden');
      parent.postMessage({type:'nyx:game-failed'},'*');
    }
    function gameSurfaceReady(){
      try{
        const doc=frame.contentDocument;
        if(!doc?.body) return false;
        const target=[...doc.querySelectorAll('canvas,object,embed,ruffle-player,ruffle-object,iframe,#game,#game-container,#unity-container,#unity-canvas,#ruffle,#player')]
          .find(el=>{
            const box=el.getBoundingClientRect?.();
            return box && box.width>40 && box.height>40 && getComputedStyle(el).display!=='none';
          });
        if(target) return true;
        return String(doc.body.textContent || '').replace(/\s+/g,' ').trim().length>40;
      }catch{
        return false;
      }
    }

    function safeGamePath(path){
      if(!path || path.includes('..') || !/^[a-z0-9_.-]+\.html(?:-[a-z0-9]+)?$/i.test(path)) return '';
      return path;
    }

    window.addEventListener('message',event=>{
      if(event.source!==frame.contentWindow) return;
      if(event.data?.type==='gn-math:ready'){
        gameReadySignal=true;
        finishGameProgress();
        return;
      }
      if(event.data?.type==='gn-math:error'){
        const url=event.data.url ? ` (${event.data.url})` : '';
        fail(`${event.data.message || 'This game failed to load.'}${url}`);
      }
    });
    frame.addEventListener('load',()=>setTimeout(finishGameProgress,1800));

    const requestedPath=safeGamePath(game);
    const gamePath=({'785-upd2.html':'785-upd3.html','253-update.html':'253-update2.html'})[requestedPath]||requestedPath;
    const archiveGame={'82-a.html':'C/clcookieclicker.html','177.html':'R/clrun3.html'}[gamePath];
    if(archiveGame){
      location.replace('/assets/ugs/play.html?game='+encodeURIComponent(archiveGame));
    }else if(!gamePath){
      fail('Missing GN Math game path.');
    }else{
      startGameProgress();
      const rawUrl=`https://raw.githubusercontent.com/freebuisness/html/main/${encodeURIComponent(gamePath)}`;
      setGameProgress(22);
      const localGame={'4-pf.html':'/assets/games/gladihoppers.html'}[gamePath];
      fetch(localGame||`/gn-math-fetch?path=${encodeURIComponent(gamePath)}`,{cache:'no-store'})
        .then(response=>{
          if(response.ok){
            setGameProgress(48);
            return response;
          }
          if(localGame)throw new Error(`HTTP ${response.status}`);
          setGameProgress(34);
          return fetch(rawUrl,{cache:'no-store'});
        })
        .then(response=>{
          if(!response.ok) throw new Error(`HTTP ${response.status}`);
          setGameProgress(58);
          return response.text();
        })
        .then(html=>{
          setGameProgress(76);
          frame.srcdoc=prepareGameDocument(html,gamePath);
          setGameProgress(88);
          setTimeout(finishGameProgress,7000);
        })
        .catch(error=>fail(`Could not load GN Math game: ${error?.message || error || 'Network error'}`));
    }
  </script>
</body>
</html>
