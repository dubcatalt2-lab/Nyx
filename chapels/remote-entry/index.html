<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Remote desktop</title><link rel="stylesheet" href="/entry.css"></head>
<body><main><p class="eyebrow">PRIVATE ACCESS</p><h1>Remote desktop</h1><p>Sign in with your owner account.</p>
<form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" disabled>Sign in</button></form>
<section id="signedIn" hidden><p id="account"></p><button id="open">Open computers</button><button id="signOut" class="secondary">Sign out</button></section>
<p id="status" role="status">Connecting…</p></main><script type="module" src="/entry.js"></script></body></html>
