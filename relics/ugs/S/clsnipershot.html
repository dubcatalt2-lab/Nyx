<html lang="en-us"><head><link href="https://raw.githack.com/meymenet645x/xu/main/TemplateData/style.css" rel="stylesheet">
    <meta charset="utf-8">
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport">
    <title>google.com</title>
    <link href="https://raw.githack.com/meymenet645x/xu/main/TemplateData/favicon.ico" rel="shortcut icon">
    
    <meta content="noindex,nofollow" name="robots">
  </head><body class="dark" dir="ltr" data-new-gr-c-s-check-loaded="14.1209.0" data-gr-ext-installed="">
    <div class="unity-desktop" id="unity-container">
      <canvas id="unity-canvas" style="background: url(&quot;https://raw.githack.com/meymenet645x/xu/main/background.jpg&quot;) center center / cover;"></canvas>
    </div>
    <div id="loading-cover" style="">
      <div id="unity-loading-bar">
        <div id="unity-logo"><img src="https://raw.githack.com/meymenet645x/xu/main/logo.png"></div>
        <div id="unity-progress-bar-empty" style="">
          <div id="unity-progress-bar-full" style="width: 0%;"></div>
        </div>
        <div class="spinner" style="display: none;"></div>
      </div>
    </div>
    <div id="unity-fullscreen-button" style="display: none;"></div>
    <script>
      const hideFullScreenButton = "1";
      const buildUrl = "https://raw.githack.com/meymenet645x/xu/main/Build/";
      const loaderUrl = buildUrl + "/SniperShot_GD.loader.js";
      const config = {
        dataUrl: buildUrl + "/SniperShot_GD.data.unityweb",
        frameworkUrl: buildUrl + "/SniperShot_GD.framework.js.unityweb",
        codeUrl: buildUrl + "/SniperShot_GD.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "GoGoMan",
        productName: "Sniper Shot",
        productVersion: "0.7",
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const spinner = document.querySelector('.spinner');

      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      }
      canvas.style.background = "url('') center / cover";
      loadingCover.style.display = "";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          loadingCover.style.display = "none";
          if (canFullscreen) {
            if (!hideFullScreenButton) {
              fullscreenButton.style.display = "";
            }
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script><script src="https://raw.githack.com/meymenet645x/xu/main/Build//SniperShot_GD.loader.js"></script>
  


</body><grammarly-desktop-integration data-grammarly-shadow-root="true"></grammarly-desktop-integration></html>
