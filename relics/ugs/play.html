<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nyx Game</title>
  <script defer src="/js/display-names.js?v=20261009-interface-words"></script>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#050814;color:#eef6ff;font-family:Outfit,Segoe UI,Arial,sans-serif}.loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#050814}.loading.hidden{display:none}.status{width:min(440px,calc(100vw - 40px));padding:22px;border:1px solid #638ee8;border-radius:14px;background:#0b1225;text-align:center}.track{height:6px;margin-top:13px;overflow:hidden;border-radius:99px;background:#1c2945}.fill{width:18%;height:100%;border-radius:inherit;background:#76a4ff;animation:load 2.2s ease-in-out infinite}.status button{min-height:36px;margin-top:14px;border:1px solid #638ee8;border-radius:9px;background:#111d39;color:#eef6ff;padding:0 13px;font:inherit;cursor:pointer}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050814}@keyframes load{50%{width:82%}}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div class="status" id="status"><span>Loading game…</span><div class="track"><div class="fill"></div></div></div></div>
  <iframe id="game" title="Game" allow="autoplay; fullscreen; gamepad; keyboard-map" allowfullscreen tabindex="0"></iframe>
  <script src="/assets/games/game-health.js" data-provider="local"></script>
  <script type="module">
    import {prepareGameDocument} from '/assets/games/game-document.js';
    const frame=document.getElementById('game');
    const loading=document.getElementById('loading');
    const status=document.getElementById('status');
    const rawPath=String(new URLSearchParams(location.search).get('game')||'').replace(/^\/+/, '');
    const externalGames={
      'F/clfnafps.html':'https://classroomlesson.github.io/basic-ruffle-player/html/fnaf_pizzeria_simulator/index.html',
      'F/clfnafsl.html':'https://classroomlesson.github.io/basic-ruffle-player/html/fnaf5/index.html'
    };
    const repairedDocuments={
      'S/clsubwaysurfersbarcelona.html':'barcelona',
      'S/clsubwaysurferswinterholiday.html':'winter-holiday'
    };
    let failed=false;
    let disposed=false;
    const loadController=new AbortController();
    const loadDeadline=setTimeout(()=>loadController.abort(),15000);
    window.addEventListener('pagehide',()=>{disposed=true;clearTimeout(loadDeadline);loadController.abort()},{once:true});
    async function fetchDocument(url){
      try{
        const response=await fetch(url,{cache:'no-store',signal:loadController.signal});
        if(!response.ok)throw new Error(`HTTP ${response.status}`);
        const source=await response.text();
        if(disposed)throw new Error('Loading cancelled');
        return source;
      }finally{clearTimeout(loadDeadline)}
    }
    let monitorRevision=0;
    function safePath(path){return path&&!path.includes('..')&&/^[a-z0-9_./%() +'\-]+$/i.test(path)?path:''}
    function fail(message){if(failed||launched)return;window.nyxReportGameFailure?.(/blank|timed out/i.test(String(message))?'startup-timeout':'load-error');failed=true;status.textContent=String(message||'This game could not be loaded.');const retry=document.createElement('button');retry.type='button';retry.textContent='retry';retry.onclick=()=>location.reload();status.append(document.createElement('br'),retry);loading.classList.remove('hidden');parent.postMessage({type:'nyx:game-failed'},'*')}
    function unwrap(source){const match=String(source).match(/<Content\b[^>]*>\s*<!\[CDATA\[([\s\S]*?)\]\]>\s*<\/Content>/i);return match?match[1]:String(source)}
    function isWrapped(source){return /<Content\b[^>]*>\s*<!\[CDATA\[/i.test(String(source))}
    function prepare(source,path){const dir=path.includes('/')?path.slice(0,path.lastIndexOf('/')+1):'';const localBase=`<base href="${location.origin}/assets/ugs/${dir}">`;const adProtection=`<script src="${location.origin}/assets/games/game-health.js"><\/script><script src="${location.origin}/assets/games/game-ad-protection.js?v=20260903-game-ads-v1"><\/script>`;const fit='<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050814}object,embed,canvas,iframe{max-width:100%;max-height:100%}.ads,.ad,.adsbygoogle,iframe[src*="doubleclick"],iframe[src*="googlesyndication"]{display:none!important}</style>';const html=unwrap(source).replace(/<script\b[^>]*src=["'][^"']*(?:\.\.\/)+storage\/js\/cloak(?:i)?\.js[^"']*["'][^>]*>\s*<\/script>/gi,'').replace(/<script\b[^>]*src=["'][^"']*(?:imasdk|(?:\/|^)ads?\.js(?:\?|$)|jump[_-]gamemonetize|poki-(?:master-loader|sdk)|html5\.api\.gamedistribution\.com|googlesyndication|doubleclick|pagead|cdn\.r9x\.in)[^"']*["'][^>]*>\s*<\/script>/gi,'');const base=/<base\b[^>]*>/i.test(html)?'':localBase;return /<head[^>]*>/i.test(html)?html.replace(/<head([^>]*)>/i,`<head$1>${base}${adProtection}${fit}`):`<!doctype html><html><head>${base}${adProtection}${fit}</head><body>${html}</body></html>`}
    let launchStarted=false;
    let launched=false;
    function reportLaunched(){if(launched||failed)return;launched=true;loading.classList.add('hidden');frame.focus();parent.postMessage({type:'nyx:game-launched'},'*')}
    function loadedErrorDocument(doc){
      try{
        if(!doc?.body)return '';
        const text=String(doc.body.innerText||doc.body.textContent||'').replace(/\s+/g,' ').trim();
        const title=String(doc.title||'').replace(/\s+/g,' ').trim();
        const summary=`${title} ${text}`.trim();
        if(summary.length>1200)return '';
        if(/^(?:404|410)(?:\s+(?:error|status))?(?:\s*[-:])?\s*(?:page\s+)?not found\.?$/i.test(text))return text;
        if(/^(?:not found|page not found|site not found)\.?$/i.test(text))return text;
        if(/\b(?:404|410)\b[\s\S]{0,80}\b(?:page\s+)?not found\b/i.test(summary))return summary;
      }catch{}
      return '';
    }
    function gameSurfaceReady(doc){
      if(!doc?.body)return false;
      if(loadedErrorDocument(doc))return false;
      const visible=element=>{
        const box=element.getBoundingClientRect?.();
        const style=getComputedStyle(element);
        return !!box&&box.width>40&&box.height>40&&style.display!=='none'&&style.visibility!=='hidden'&&style.opacity!=='0';
      };
      const gameSurface=[...doc.querySelectorAll('canvas,object,embed,ruffle-player,ruffle-object,iframe,#game,#game-container,#unity-container,#unity-canvas,#ruffle,#player')].find(visible);
      if(gameSurface)return true;
      const visiblePage=[...doc.body.children].find(element=>
        !/^(?:SCRIPT|STYLE|LINK|META|NOSCRIPT|TEMPLATE)$/.test(element.tagName)&&visible(element)
      );
      return !!visiblePage||String(doc.body.textContent||'').replace(/\s+/g,' ').trim().length>8;
    }
    async function missingLocalResource(win,important,ignorable){const entries=win.performance?.getEntriesByType?.('resource')||[];for(const entry of entries){let url;try{url=new URL(entry.name)}catch{continue}if(url.origin!==location.origin||!important.test(url.href)||ignorable.test(url.href)||entry.encodedBodySize>0)continue;try{const response=await fetch(url.href,{method:'HEAD',cache:'no-store'});if(!response.ok)return url.href}catch{return url.href}}return''}
    function monitorGame(){
      const revision=++monitorRevision;
      if(!launchStarted||failed||launched)return;
      try{
        const win=frame.contentWindow,doc=frame.contentDocument;
        if(!doc?.body){setTimeout(reportLaunched,900);return;}
        const current=()=>revision===monitorRevision&&frame.contentDocument===doc&&!failed&&!launched;
        const notFound=loadedErrorDocument(doc);
        if(notFound){fail('This game source returned a not-found page.');return;}
        const important=/\.(?:wasm|data|unityweb|json|swf|zip|7z|js)(?:[?#]|$)|\/Build\//i;
        const ignorable=/googletagmanager|google-analytics|googlesyndication|doubleclick|facebook|recaptcha|pagead/i;
        doc.addEventListener('error',event=>{
          const target=event.target,url=target&&(target.src||target.href);
          if(current()&&url&&important.test(String(url))&&!ignorable.test(String(url))&&!gameSurfaceReady(doc))
            fail(`A required game file failed to load: ${url}`);
        },true);
        const started=performance.now();
        const check=async()=>{
          if(!current())return;
          if(gameSurfaceReady(doc)){reportLaunched();return;}
          const missing=await missingLocalResource(win,important,ignorable);
          if(!current())return;
          if(gameSurfaceReady(doc)){reportLaunched();return;}
          if(missing){fail(`A required game file failed to load: ${missing}`);return;}

          if(performance.now()-started>90000){fail('This game startup timed out.');return;}
          setTimeout(check,650);
        };
        setTimeout(check,500);
      }catch{setTimeout(()=>{if(revision===monitorRevision)reportLaunched();},900);}
    }
    frame.addEventListener('load',monitorGame);
    const path=safePath(rawPath);
    if(!path) fail('Invalid game path.');
    else if(['1/cl1v1doubleimprettysureitsexactlythesameidk.html','1/cl1v1lolifnoaboutblank.html','1/cl1v1lolnoaboutblank.html','1/cl1v1maybeidk.html'].includes(path)){
      location.replace('/assets/ugs/play.html?game=1%2Fcl1v1lol.html');
    }
    else if(path==='S/clsmashkarts.html'||path==='B/clbitplanes.html'){


      location.replace('/assets/gn-math/play.html?game='+(path==='B/clbitplanes.html'?'330.html':'370-f.html'));
    }
    else if(path==='A/clasmallworldcup.html'){
      const sourceUrl=location.origin+'/assets/games/small-world-cup.html';
      fetchDocument(sourceUrl)
        .then(source=>{launchStarted=true;frame.srcdoc=prepareGameDocument(source,path,sourceUrl);})
        .catch(error=>fail(`Could not load game: ${error.message||error}`));
    }
    else if(externalGames[path]){launchStarted=true;frame.src=externalGames[path]}
    else if(repairedDocuments[path]){
      const sourceUrl=location.origin+'/assets/games/subway-surfers.html';
      fetchDocument(sourceUrl)
        .then(source=>{launchStarted=true;frame.srcdoc=prepareGameDocument(source.replace('data-edition="barcelona"',`data-edition="${repairedDocuments[path]}"`),path,sourceUrl);})
        .catch(error=>fail(`Could not load game: ${error.message||error}`));
    }
    else {
      const assetUrl=`/assets/ugs/${path}`;
      fetchDocument(assetUrl).then(source=>{
        if(disposed)return;
        launchStarted=true;
        if(path==='G/clgetawayshootout.html'||isWrapped(source)||/<base\b[^>]*href=["'][^"']*(?:cdn\.jsdelivr\.net|raw(?:cdn)?\.githack\.com|raw\.githubusercontent\.com)/i.test(source))frame.srcdoc=prepareGameDocument(unwrap(source),path,location.origin+assetUrl);
        else frame.srcdoc=prepare(source,path);
      }).catch(error=>{if(!disposed)fail(`Could not load game: ${error.message||error}`)});
    }
  </script>
</body>
</html>
